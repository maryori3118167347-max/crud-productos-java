<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario de Productos</title>
<style>
  :root {
    --bg: #12151c;
    --panel: #1a1e28;
    --border: #2a2f3d;
    --text: #e8eaf0;
    --muted: #8890a3;
    --accent: #5b8def;
    --danger: #e5566f;
    --ok: #4ecb8f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 32px 20px 60px;
  }

  .wrap { max-width: 880px; margin: 0 auto; }

  header { margin-bottom: 28px; }
  header h1 {
    font-size: 1.6rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header p { color: var(--muted); margin: 0; font-size: 0.92rem; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 22px;
  }

  .panel h2 {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 16px;
  }

  form {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1.2fr auto;
    gap: 10px;
    align-items: end;
  }

  @media (max-width: 700px) {
    form { grid-template-columns: 1fr 1fr; }
  }

  label {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 4px;
  }

  input {
    width: 100%;
    background: #0f121a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 10px;
    border-radius: 6px;
    font-size: 0.9rem;
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 0.88rem;
    font-weight: 600;
  }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #4a7ce0; }

  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 0.78rem; text-transform: uppercase; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 0.75rem;
    background: rgba(91,141,239,0.15);
    color: var(--accent);
  }

  .row-actions button {
    background: transparent;
    color: var(--muted);
    padding: 4px 8px;
    font-size: 0.8rem;
  }
  .row-actions button:hover { color: var(--text); }
  .row-actions .del:hover { color: var(--danger); }

  .empty {
    color: var(--muted);
    font-size: 0.88rem;
    padding: 20px 0;
    text-align: center;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 0.85rem;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.25s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ok { border-color: var(--ok); }
  .toast.err { border-color: var(--danger); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Inventario de Productos</h1>
      <p>CRUD conectado a un backend en Java puro (com.sun.net.httpserver).</p>
    </header>

    <div class="panel">
      <h2 id="form-title">Nuevo producto</h2>
      <form id="producto-form">
        <input type="hidden" id="producto-id">
        <div>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Ej. Laptop 14''" required>
        </div>
        <div>
          <label for="precio">Precio</label>
          <input type="number" id="precio" min="0" step="0.01" placeholder="0.00" required>
        </div>
        <div>
          <label for="stock">Stock</label>
          <input type="number" id="stock" min="0" step="1" placeholder="0" required>
        </div>
        <div>
          <label for="categoria">Categoría</label>
          <input type="text" id="categoria" placeholder="Ej. Tecnología" required>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Guardar</button>
      </form>
    </div>

    <div class="panel">
      <h2>Listado</h2>
      <table id="tabla-productos">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Categoría</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabla-body"></tbody>
      </table>
      <div id="empty-state" class="empty" style="display:none;">Aún no hay productos registrados.</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
